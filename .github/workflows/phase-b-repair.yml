name: Phase B Repair
on:
  push:
    branches:
      - agent/phase-b-ai-state-consolidation
    paths:
      - .phase-b-repair
      - .github/workflows/phase-b-repair.yml
permissions:
  contents: write
jobs:
  repair:
    if: hashFiles('.phase-b-repair') != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase-b-ai-state-consolidation
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Patch Phase B integration
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('ai/evaluator.py')
          s = p.read_text(encoding='utf-8')
          old = '''def _legacy_state_store():\n    """Build the unified store and import legacy files only when necessary."""\n    store = AIStateStore()'''
          new = '''def _legacy_state_store():\n    """Build the unified store and import legacy files only when necessary."""\n    state_path = AI_PROGRESS_PATH.with_name("ai-state.json")\n    store = AIStateStore(state_path)'''
          if old not in s:
              raise SystemExit('state-store path anchor not found')
          s = s.replace(old, new, 1)
          old = '''    deadline_reached = _deadline_reached(deadline)\n    progress = {\n        **progress_identity,\n        "version": AI_PROGRESS_VERSION,\n        "status": "deadline_exceeded" if deadline_reached else "completed",\n        "evaluated_count": sum(1 for state in store.load().values() if state.status in {EVALUATED, PASSED, REJECTED}),\n        "total_candidates": len(ordered_jobs) + len(resumed_jobs),\n        "state_store": "run-artifacts/ai-state.json",\n        "completed_at": datetime.now(timezone.utc).isoformat(),\n    }'''
          new = '''    deadline_reached = _deadline_reached(deadline)\n    state_snapshot = store.load()\n    current_by_url = {job.job_url: job for job in listings if job.job_url}\n    evaluated_jobs = {}\n    for url, state in state_snapshot.items():\n        if state.status not in {EVALUATED, PASSED, REJECTED} or not state.verdict:\n            continue\n        job = current_by_url.get(url)\n        if job is None:\n            continue\n        evaluated_jobs[url] = {\n            **job.to_dict(),\n            **state.verdict,\n            "evaluation_key": state.evaluation_key,\n            "state_status": state.status,\n        }\n    progress = {\n        **progress_identity,\n        "version": AI_PROGRESS_VERSION,\n        "status": "deadline_exceeded" if deadline_reached else "completed",\n        "evaluated_jobs": evaluated_jobs,\n        "evaluated_count": len(evaluated_jobs),\n        "total_candidates": len(ordered_jobs) + len(resumed_jobs),\n        "state_store": str(store.path),\n        "completed_at": datetime.now(timezone.utc).isoformat(),\n    }'''
          if old not in s:
              raise SystemExit('legacy-progress projection anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          workflow = Path('.github/workflows/job-alerts.yml')
          w = workflow.read_text(encoding='utf-8')
          old_w = '''          path: run-artifacts/ai-progress.json\n          if-no-files-found: ignore'''
          new_w = '''          path: |\n            run-artifacts/ai-progress.json\n            run-artifacts/ai-state.json\n          if-no-files-found: ignore'''
          if old_w not in w:
              raise SystemExit('checkpoint artifact upload anchor not found')
          workflow.write_text(w.replace(old_w, new_w, 1), encoding='utf-8')
          PY
      - name: Run focused Phase B tests
        run: python -m pytest -q tests/test_ai_checkpoint_resume.py tests/test_ai_concurrency.py tests/test_ai_deadline.py tests/test_ai_state.py
      - name: Run full test suite
        run: python -m pytest -q
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ai/evaluator.py .github/workflows/job-alerts.yml
          git commit -m 'fix: preserve Phase B state isolation and legacy checkpoint view'
          git push origin HEAD:agent/phase-b-ai-state-consolidation
          rm -f .phase-b-repair
          git add .phase-b-repair
          git commit -m 'chore: remove Phase B repair marker'
          git push origin HEAD:agent/phase-b-ai-state-consolidation
