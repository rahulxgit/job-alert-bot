name: Daily Job Alert

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: "30 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-job-alert
  cancel-in-progress: false

jobs:
  run-job-search:
    runs-on: ubuntu-latest
    # The workflow has explicit stage budgets; this is only the final safety net.
    timeout-minutes: 90

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore latest AI checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p run-artifacts
          artifact_id="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=ai-checkpoint&per_page=20" --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')"
          if [ -z "${artifact_id}" ]; then
            echo "No previous AI checkpoint artifact found."
            exit 0
          fi
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > /tmp/ai-checkpoint.zip
          unzip -o /tmp/ai-checkpoint.zip -d run-artifacts >/dev/null
          echo "Restored AI checkpoint artifact ${artifact_id}."

      - name: Compute adaptive AI admission limit
        env:
          MAX_LLM_CANDIDATES: "300"
          LLM_EVALUATION_BUDGET_SECONDS: "3300"
          AI_MAX_CONCURRENCY: "6"
          AI_ADMISSION_DEFAULT_LATENCY_SECONDS: "90"
          AI_ADMISSION_SAFETY_FACTOR: "0.75"
          AI_ADMISSION_MIN_CANDIDATES: "40"
        run: python -m ai.admission_controller

      - name: Restore AI retry queue
        uses: actions/cache@v5
        with:
          path: failed-ai-jobs.json
          key: failed-ai-jobs-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            failed-ai-jobs-

      - name: Cache Crawl4AI browser binaries
        uses: actions/cache@v5
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.cache/patchright
          key: crawl4ai-browsers-${{ runner.os }}-py311-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            crawl4ai-browsers-${{ runner.os }}-py311-

      - name: Install Crawl4AI browser
        env:
          DEBIAN_FRONTEND: noninteractive
        run: python -m playwright install chromium

      - name: Run job search script
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LINKEDIN_LI_AT_COOKIE: ${{ secrets.LINKEDIN_LI_AT_COOKIE }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_ENABLED: "false"
          CRAWL4AI_DISCOVERY_ENABLED: "true"
          CRAWL4AI_DISCOVERY_MAX_SEEDS: "20"
          CRAWL4AI_DISCOVERY_MAX_PAGES: "1000"
          CRAWL4AI_DISCOVERY_MAX_DETAIL_PAGES: "5000"
          CRAWL4AI_DISCOVERY_SEED_CONCURRENCY: "4"
          CRAWL4AI_DISCOVERY_HEALTHCHECK_ENABLED: "true"
          CRAWL4AI_DISCOVERY_HEALTHCHECK_URL: "https://example.com/"
          JOBSPY_MAX_COMBINATIONS: "24"
          JOBSPY_MAX_CONCURRENCY: "4"
          JOBSPY_RESULTS_PER_SITE: "15"
          JOBSPY_CALL_TIMEOUT_SECONDS: "60"
          LLM_EVALUATION_BUDGET_SECONDS: "3300"
          AI_MAX_CONCURRENCY: "6"
          GEMINI_SHARED_BACKOFF_SECONDS: "65"
          # The gateway (Render free tier) can take well over the old 12s
          # to wake a cold provider; give it real headroom instead of
          # falling back to Gemini on nearly every request.
          AI_GATEWAY_TIMEOUT_SECONDS: "75"
          AI_GATEWAY_MAX_TOKENS: "2048"
          GEMINI_TIMEOUT_SECONDS: "45"
          GEMINI_MAX_OUTPUT_TOKENS: "1536"
          SOURCE_406_BREAKER_THRESHOLD: "3"
          SOURCE_404_BREAKER_THRESHOLD: "10"
          CRAWL_PROVIDER: "auto"
          CRAWL4AI_TIMEOUT: "30"
          CRAWL4AI_MAX_DETAIL_PAGES: "25"
        run: python -u main.py

      - name: Upload AI checkpoint
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ai-checkpoint
          # ai-state.json is the authoritative per-job evaluation state
          # (evaluator._legacy_state_store()); ai-progress.json alone is
          # only a lightweight legacy summary. Without ai-state.json here,
          # a same-day resumed/re-triggered run cannot skip candidates it
          # already evaluated and re-spends AI budget on them.
          path: |
            run-artifacts/ai-progress.json
            run-artifacts/ai-state.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload job run artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: job-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: run-artifacts/
          if-no-files-found: ignore
          retention-days: 14
