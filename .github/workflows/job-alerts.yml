name: Daily Job Alert

on:
  schedule:
    # 8:00 AM IST = 2:30 AM UTC
    - cron: "30 2 * * *"
  workflow_dispatch: {}

concurrency:
  group: daily-job-alert
  cancel-in-progress: false

jobs:
  run-job-search:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Crawl4AI browser
        run: crawl4ai-setup

      - name: Run job search script
        env:
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_LI_AT_COOKIE: ${{ secrets.LINKEDIN_LI_AT_COOKIE }}
          HUNTER_API_KEY: ${{ secrets.HUNTER_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          AI_GATEWAY_URL: ${{ secrets.AI_GATEWAY_URL }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          # Keep Firecrawl code available but do not spend credits on the
          # scheduled run. Set this to "true" when credits are available.
          FIRECRAWL_ENABLED: "false"
          JOBSPY_MAX_COMBINATIONS: "24"
          JOBSPY_RESULTS_PER_SITE: "15"
          JOBSPY_CALL_TIMEOUT_SECONDS: "60"
          CRAWL_PROVIDER: "auto"
          CRAWL4AI_TIMEOUT: "30"
          CRAWL4AI_MAX_DETAIL_PAGES: "25"
        run: python -u main.py
